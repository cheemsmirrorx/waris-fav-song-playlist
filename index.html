<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Waris Favourite Songs Playlist 🥀</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="player-window" role="application" aria-label="Media Player">
    
    <!-- Title Bar -->
    <div class="title-bar">
      <div class="title-text">
        <span class="icon">▶</span>
        <span>Waris Player</span>
      </div>
      <div class="window-controls">
        <button aria-label="Minimize">_</button>
        <button aria-label="Maximize">□</button>
        <button aria-label="Close" class="close-btn">✕</button>
      </div>
    </div>

    <!-- Instagram Watermark Strip -->
    <div class="watermark-strip">
      <span class="watermark-label">
        <span class="creator-dot"></span>
        Curator
      </span>
      <a href="https://instagram.com/waris.xd" target="_blank" rel="noopener noreferrer" class="watermark-link">
        <div class="watermark-icon-box">
          <svg viewBox="0 0 24 24">
            <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.13-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
          </svg>
        </div>
        <span class="watermark-handle">@waris.xd</span>
      </a>
    </div>

    <!-- Menu Bar -->
    <div class="menu-bar">
      <span>File</span>
      <span>View</span>
      <span>Play</span>
      <span>Tools</span>
      <span>Help</span>
    </div>

    <!-- Main Player Body -->
    <div class="player-body">
      
      <!-- Visual Display Area -->
      <div class="display-container">
        <div class="cover-wrapper">
          <img id="cover-art" src="media/covers/cover1.jpg" alt="Album Cover">
        </div>
        
        <!-- Equalizer Bars -->
        <div class="equalizer" id="equalizer" aria-hidden="true">
          <span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span>
        </div>
      </div>

      <!-- Status Display -->
      <div class="status-box">
        <div id="track-status" class="ticker">Ready</div>
      </div>

      <!-- Scrubber & Time -->
      <div class="scrubber-container">
        <span id="current-time">0:00</span>
        <input type="range" id="seek-bar" value="0" min="0" step="1">
        <span id="total-duration">0:00</span>
      </div>

      <!-- Playback Controls -->
      <div class="controls">
        <button id="prev-btn" title="Previous">⏮</button>
        <button id="play-btn" title="Play">▶</button>
        <button id="stop-btn" title="Stop">⏹</button>
        <button id="next-btn" title="Next">⏭</button>
        <div class="volume-container">
          <span>🔊</span>
          <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="0.8">
        </div>
      </div>

    </div>

    <!-- Playlist Section -->
    <div class="playlist-section">
      <div class="playlist-header">Playlist</div>
      <ul id="playlist-items" class="playlist-list"></ul>
    </div>

  </div>

  <audio id="audio-engine" preload="metadata"></audio>
  <script src="script.js"></script>
</body>
</html>
